# ============================================================
# arronflow — tmux configuration
# ============================================================
# Deployed to ~/.config/tmux/tmux.conf (symlink, see scripts/install.sh).
# tmux still prefers ~/.tmux.conf when that file exists — the migration
# moved it aside (a .bak.<timestamp> copy remains on the machine).
# Reload inside a running session with:  prefix + r

# ============================================================
# Base options
# ============================================================

# Prefix: Ctrl+a, easier to reach than the default Ctrl+b.
# A second Ctrl+a passes a literal Ctrl+a to the pane.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal type advertised to programs inside panes, plus 24-bit color
# passthrough so true color survives inside tmux (Ghostty supports it).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# Scrollback history per pane, in lines.
set -g history-limit 50000

# Number windows and panes from 1 instead of 0 — matches the number row.
set -g base-index 1
setw -g pane-base-index 1

# Mouse: click focuses a pane, drag selects text inside one pane, the
# wheel scrolls pane history, borders drag-resize. Shift + drag does a
# native Ghostty selection (crossing panes, including the status line).
set -g mouse on

# Keep window numbers gapless as windows are closed.
set -g renumber-windows on

# Report focus in/out so Neovim and friends can react to the active pane.
set -g focus-events on

# No bells, no visual flashes.
set -g bell-action none
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# ============================================================
# Copy & paste
# ============================================================
# Two clipboards exist: tmux's own paste buffers, and the macOS system
# clipboard. `set-clipboard on` forwards every copy — mouse release,
# double-click, copy-mode keys — to the system clipboard too, via the
# OSC 52 escape sequence. Ghostty accepts OSC 52, and the same path
# works over ssh, where a remote pbcopy would not exist.
set -g set-clipboard on

# Copy mode (prefix + [) speaks vi: hjkl motion, matching the rest of
# this setup. Defaults stay: Space starts a selection, Enter copies, q
# quits. v and y are the familiar vim-style additions; plain v was
# rectangle-toggle by default, so that moves to Ctrl-v.
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Double-click (word) and triple-click (line) selection work out of the
# box in tmux >= 3.7 — nothing to configure here; see docs/tmux.md.

# ============================================================
# Key bindings
# ============================================================

# Splits: prefix + \ (side by side) and prefix + - (stacked), both
# opening in the current pane's directory.
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane traversal in vim directions.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing: capital letters; `-r` makes them repeatable while held.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this file without restarting the server.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# New window, keeping the current directory.
bind t new-window -c "#{pane_current_path}"

# ============================================================
# Theme — Atom One Dark, anchored to the Ghostty palette
# ============================================================
# Every color below is an Atom One Dark palette value, chosen by role:
# the bar sits on the editor "gutter" tone (one step darker than the
# window background #282c34) so it reads as furniture, not content;
# highlight blocks use Atom's selection tone; blue is reserved for
# "focus" (session identity + current window). Separators are the same
# sharp Powerline triangles the p10k prompt uses. No decorative icons,
# matching the sparse prompt style.

# Bar background and default text.
set -g status-style "bg=#21252b,fg=#abb2bf"

# Left: session name — the only blue block, our anchor of identity.
set -g status-left "#[fg=#61afef,bg=#3e4451,bold] #S #[nobold,fg=#3e4451,bg=#21252b]"
set -g status-left-length 40

# Middle: window list. Inactive windows quiet; the current window is
# the brightest thing on the bar, so the eye always knows the focus.
# #F appends window flags (Z zoomed, M marked, # activity, - last) —
# the old format dropped them, hiding the zoom indicator.
setw -g window-status-format "#[fg=#5c6370] #I #[fg=#abb2bf]#W#F "
setw -g window-status-current-format "#[fg=#61afef,bg=#3e4451,bold] #I #W#F #[default]"

# Right: dim clock in the same block shape as the session.
set -g status-right "#[fg=#3e4451,bg=#21252b]#[nobold,fg=#abb2bf,bg=#3e4451] %Y-%m-%d %H:%M "
set -g status-right-length 60

# Pane borders: deliberately left at tmux defaults. The default focus
# border is informative, not just decorative: green when focused,
# yellow while the pane is in copy mode, red under synchronize-panes.
# (A themed version — dim idle borders, blue focus — was tried on
# 2026-09-27 and reverted on request.)

# Copy-mode selection highlight (Atom's selection tone) and the
# command/message prompt line.
set -g mode-style "bg=#3e4451,fg=#dcdfe4"
set -g message-style "bg=#3e4451,fg=#dcdfe4"
